################################################################################################################
# Toolhead 2
# Toolhead Board: LDO Nitehawk 36 Stealthchanger Edition
# Extruder:       Orbiter 2.0
# Hotend:         Rapido 2 HF
################################################################################################################

#####################################################################
# MCU
#####################################################################

[mcu Toolhead2]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3033393834055A6D-if00     # Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
restart_method: command


#####################################################################
# Accelerometer
#####################################################################

[adxl345 T2]
cs_pin: Toolhead2:gpio27
spi_software_sclk_pin: Toolhead2:gpio18
spi_software_mosi_pin: Toolhead2:gpio20
spi_software_miso_pin: Toolhead2:gpio19
axes_map: -x,-z,-y

#####################################################################
# Extruder
#####################################################################

[extruder2]
step_pin: Toolhead2:gpio23
dir_pin: !Toolhead2:gpio24
enable_pin: !Toolhead2:gpio25
microsteps: 32
rotation_distance: 4.69
full_steps_per_rotation: 200
nozzle_diameter: 0.400     # Hot tighten the Nozzle at 285 °C, 2,5 NM
filament_diameter: 1.750
max_extrude_only_distance: 200
pressure_advance: 0.025
pressure_advance_smooth_time: 0.03
heater_pin: Toolhead2:gpio9
max_power: 0.6     # LDO Nitehawk 36 Max Power 120W, Rapido 2 HF -> 115W Heater * 0.6 = 69W
sensor_type: PT1000
sensor_pin: Toolhead2:gpio29
pullup_resistor: 2200
control: pid
pid_Kp: 17.950
pid_Ki: 1.459
pid_Kd: 55.196
min_extrude_temp: 170
min_temp: 0
max_temp: 290

[tmc2209 extruder2]
uart_pin: Toolhead2:gpio0
tx_pin: Toolhead2:gpio1
sense_resistor: 0.100
run_current: 0.5
interpolate: false
stealthchop_threshold: 0


#####################################################################
# Fans
#####################################################################

# Hotend Fan
[heater_fan Toolhead2_hotend_fan]
pin: Toolhead2:gpio5
heater: extruder2
heater_temp: 50.0
shutdown_speed: 1
tachometer_pin: Toolhead2:gpio16
tachometer_ppr: 2

# Part Cooling Fan
[fan_generic Toolhead2_part_fan]
pin: Toolhead2:gpio6


#####################################################################
# Toolchanger
#####################################################################

[tool T2]
tool_number: 2 # change to the index of the tool. 0, 1, 2, etc.
extruder: extruder2
fan: Toolhead2_part_fan
params_park_x: 194.6 # The absolute X-position of the tool in its dock.
params_park_y: 3.6 # The absolute Y-position of the tool in its dock.
params_park_z: 250 # The absolute Z-position where the tool and shuttle mate in the dock, determined when the TAP (or Z-probe) triggers.
gcode_x_offset: -0.010 # The X-Axis offset of the nozzle's orifice in relation to tool 0
gcode_y_offset: 0.040 # The Y-Axis offset of the nozzle's orifice in relation to tool 0
gcode_z_offset: -0.280 # The Z-Axis offset of the nozzle's orifice in relation to tool 0

# Results from input shaper
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 46.8
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 33.6


#####################################################################
# Probe
#####################################################################

[tool_probe T2]
pin: Toolhead2:gpio10
tool: 2 # change to the index of the tool. 0, 1, 2, etc.
z_offset: -1.247 # Needs to be calibrated. More positive = More Squish
speed: 5.0
lift_speed: 28
samples: 2
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder2 # change to match the extruder you are configuring: extruder, extruder1, etc.


#####################################################################
# Lights
#####################################################################

# Logo LED
[neopixel T2]
pin: Toolhead2:gpio7
color_order: GRBW
chain_count: 3
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[delayed_gcode set_t2_leds]
initial_duration: 1
gcode:
    SET_LED LED=T2 RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=T2 RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=2 TRANSMIT=0
    SET_LED LED=T2 RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=3

# PCB Activity Light
[output_pin act_led_T2]
pin: !Toolhead2:gpio8


#####################################################################
# Addtional Sensors
#####################################################################

[temperature_sensor Toolhead2]
sensor_type: temperature_mcu
sensor_mcu: Toolhead2
min_temp: 0
max_temp: 100


#####################################################################
# GCode Macro
#####################################################################

[gcode_macro T2]
variable_active: 0 # Must be zero.
variable_color: "" # Leave empty
variable_spool_id: None
gcode:
    {% if printer["gcode_macro T2"].spool_id %}
        SET_ACTIVE_SPOOL ID={printer["gcode_macro T2"].spool_id}
    {% endif %}
    SELECT_TOOL T=2 # change to the index of the tool. 0, 1, 2, etc.