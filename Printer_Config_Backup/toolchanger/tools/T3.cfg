################################################################################################################
# Toolhead 3
# Toolhead Board: LDO Nitehawk 36 Stealthchanger Edition
# Extruder:       Galileo 2
# Hotend:         Dragon HF - Voron Edition
################################################################################################################

#####################################################################
# MCU
#####################################################################

[mcu Toolhead3]
serial: /dev/serial/by-id/usb-Klipper_rp2040_323232323619305C-if00     # Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
restart_method: command


#####################################################################
# Accelerometer
#####################################################################

[adxl345 T3]
cs_pin: Toolhead3:gpio27
spi_software_sclk_pin: Toolhead3:gpio18
spi_software_mosi_pin: Toolhead3:gpio20
spi_software_miso_pin: Toolhead3:gpio19
axes_map: -x,-z,-y

#####################################################################
# Extruder
#####################################################################

[extruder3]
step_pin: Toolhead3:gpio23
dir_pin: !Toolhead3:gpio24
enable_pin: !Toolhead3:gpio25
microsteps: 16
rotation_distance: 46.589
gear_ratio: 9:1
full_steps_per_rotation: 200
nozzle_diameter: 0.400     # Hot tighten the Nozzle at 285 °C, 2,5 NM
filament_diameter: 1.750
max_extrude_only_distance: 200
pressure_advance: 0.025
pressure_advance_smooth_time: 0.03
heater_pin: Toolhead3:gpio9
#max_power: 0.6     # LDO Nitehawk 36 Max Power 120W, Rapido 2 HF -> 115W Heater * 0.6 = 69W
sensor_type: Generic 3950
sensor_pin: Toolhead3:gpio29
pullup_resistor: 2200
control: pid
pid_Kp: 27.704
pid_Ki: 2.252
pid_Kd: 85.190
min_extrude_temp: 170
min_temp: 0
max_temp: 290

[tmc2209 extruder3]
uart_pin: Toolhead3:gpio0
tx_pin: Toolhead3:gpio1
sense_resistor: 0.100
run_current: 0.6
interpolate: false
stealthchop_threshold: 0


#####################################################################
# Fans
#####################################################################

# Hotend Fan
[heater_fan Toolhead3_hotend_fan]
pin: Toolhead3:gpio5
heater: extruder3
heater_temp: 50.0
shutdown_speed: 1
tachometer_pin: Toolhead3:gpio16
tachometer_ppr: 2

# Part Cooling Fan
[fan_generic Toolhead3_part_fan]
pin: Toolhead3:gpio6


#####################################################################
# Toolchanger
#####################################################################

[tool T3]
tool_number: 3 # change to the index of the tool. 0, 1, 2, etc.
extruder: extruder3
fan: Toolhead3_part_fan
params_park_x: 290.5 # The absolute X-position of the tool in its dock.
params_park_y: 3.6 # The absolute Y-position of the tool in its dock.
params_park_z: 250 # The absolute Z-position where the tool and shuttle mate in the dock, determined when the TAP (or Z-probe) triggers.
gcode_x_offset: 0.080 # The X-Axis offset of the nozzle's orifice in relation to tool 0
gcode_y_offset: -0.240 # The Y-Axis offset of the nozzle's orifice in relation to tool 0
gcode_z_offset: 0.147 # The Z-Axis offset of the nozzle's orifice in relation to tool 0

# Results from input shaper
params_input_shaper_type_x: '2hump_ei'
params_input_shaper_freq_x: 70.4
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 32.8


#####################################################################
# Probe
#####################################################################

[tool_probe T3]
pin: Toolhead3:gpio10
tool: 3 # change to the index of the tool. 0, 1, 2, etc.
z_offset: -1.300 # Needs to be calibrated. More positive = More Squish
speed: 5.0
lift_speed: 28
samples: 2
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder3 # change to match the extruder you are configuring: extruder, extruder1, etc.


#####################################################################
# Lights
#####################################################################

# Logo LED
[neopixel T3]
pin: Toolhead3:gpio7
color_order: GRBW
chain_count: 3
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[delayed_gcode set_t3_leds]
initial_duration: 1
gcode:
    SET_LED LED=T3 RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=T3 RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=2 TRANSMIT=0
    SET_LED LED=T3 RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=3

# PCB Activity Light
[output_pin act_led_T3]
pin: !Toolhead3:gpio8


#####################################################################
# Addtional Sensors
#####################################################################

[temperature_sensor Toolhead3]
sensor_type: temperature_mcu
sensor_mcu: Toolhead3
min_temp: 0
max_temp: 100


#####################################################################
# GCode Macro
#####################################################################

[gcode_macro T3]
variable_active: 0 # Must be zero.
variable_color: "" # Leave empty
variable_spool_id: None
gcode:
    {% if printer["gcode_macro T3"].spool_id %}
        SET_ACTIVE_SPOOL ID={printer["gcode_macro T3"].spool_id}
    {% endif %}
    SELECT_TOOL T=3 # change to the index of the tool. 0, 1, 2, etc.