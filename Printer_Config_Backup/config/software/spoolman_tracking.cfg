##############################################################################
# Spoolman fuer Fluidd + Toolchanger
#
# Voraussetzungen in printer.cfg:
#   [save_variables]
#   filename: ~/printer_data/config/saved_variables.cfg
#
# Setup:
# 1. Datei nach ~/printer_data/config/spoolman_tracking.cfg kopieren
# 2. [include spoolman_tracking.cfg] in printer.cfg eintragen
# 3. In jeder Tx.cfg das gcode_macro anpassen (siehe unten)
#
# Tx.cfg Beispiel (T0):
#   [gcode_macro T0]
#   variable_active: 0
#   variable_color: ""
#   variable_spool_id: None
#   gcode:
#       SET_ACTIVE_SPOOL ID={printer["gcode_macro T0"].spool_id}
#       SELECT_TOOL T=0
#
# Spulen werden ueber Fluidd UI -> Spoolman -> Change Spool zugewiesen
##############################################################################


[gcode_macro SET_ACTIVE_SPOOL]
gcode:
    {% if params.ID %}
        {% set id = params.ID|int %}
        {action_call_remote_method(
            "spoolman_set_active_spool",
            spool_id=id
        )}
    {% else %}
        {action_respond_info("Parameter 'ID' is required")}
    {% endif %}


[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
    {action_call_remote_method(
        "spoolman_set_active_spool",
        spool_id=None
    )}


[delayed_gcode RESTORE_SELECTED_SPOOLS]
initial_duration: 0.1
gcode:
    {% set svv = printer.save_variables.variables %}
    {% for object in printer %}
        {% if object.startswith('gcode_macro ') and printer[object].spool_id is defined %}
            {% set macro = object.replace('gcode_macro ', '') %}
            {% set var = (macro + '__SPOOL_ID')|lower %}
            {% if svv[var] is defined %}
                SET_GCODE_VARIABLE MACRO={macro} VARIABLE=spool_id VALUE={svv[var]}
            {% endif %}
        {% endif %}
    {% endfor %}