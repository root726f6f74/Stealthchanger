################################################################################################################
# Toolchanger - Own Overrides
# Overrides values of the stock klipper-toolchanger-easy files in readonly-configs/.
# Must be included last (done by toolchanger-include.cfg), Klipper keeps the last value it reads.
################################################################################################################


################################################################################################################
# Motion helpers required by the toolchanger
################################################################################################################

[rounded_path]
resolution: 0.2             # length of the segments that approximate the rounded corners
replace_g0: False           # do not round normal G0 moves

[force_move]
enable_force_move: True


################################################################################################################
# Dock paths and speeds
# Path points are relative to the park position of the tool (params_park_x/y/z in tools/Tx.cfg).
# 'f' = speed factor, 'verify' = check via the tool probe that the tool is mounted.
################################################################################################################

[toolchanger]
params_dropoff_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-12, 'y':0}, {'z':-12, 'y':16}]
params_pickup_path: [{'z':-12, 'y':16}, {'z':-12, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':2}, {'y':9.5 ,'z':4}]
params_safe_y: 120          # Y position that is safe to travel in X in front of the docks
params_close_y: 30          # Y position close to the docks where the slow approach starts
params_fast_speed: 10000    # travel speed in mm/min
params_path_speed: 900      # speed along the dock path in mm/min (15 mm/s)
require_tool_present: True  # a tool must be on the shuttle (Tap is the Z probe)


################################################################################################################
# Homing
################################################################################################################

[gcode_macro homing_override_config]
variable_sensorless_x: True
variable_sensorless_y: False
variable_homing_rebound_y: 0            # only needed for sensorless Y
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.49           # reduced X current while homing sensorless


################################################################################################################
# Temperature wait deadband
# M109 is overridden: it waits until the temperature is within +- deadband of the target
# (stock default +- 1 C, here +- 4 C).
################################################################################################################

[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
variable_default_deadband: 4.0

# Tool offset calibration is done with Axiscope (config/software/axiscope.cfg),
# so the stock [tools_calibrate] / _CALIBRATION_SWITCH sections are not used.
