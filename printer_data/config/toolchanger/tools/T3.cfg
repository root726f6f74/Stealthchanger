################################################################################################################
# Tool 3 (T3)
# Toolhead board: LDO Nitehawk 36 StealthChanger Edition (USB)
# Extruder:       Galileo 2 Standalone
# Hotend:         Dragon HF Voron Edition
# Use:            Abrasive materials
################################################################################################################


################################################################################################################
# MCU
################################################################################################################

[mcu Toolhead3]
serial: /dev/serial/by-id/usb-Klipper_rp2040_323232323619305C-if00    # find with: ls -l /dev/serial/by-id/
restart_method: command


################################################################################################################
# Accelerometer
################################################################################################################

[adxl345 T3]
cs_pin: Toolhead3:gpio27
spi_software_sclk_pin: Toolhead3:gpio18
spi_software_mosi_pin: Toolhead3:gpio20
spi_software_miso_pin: Toolhead3:gpio19
axes_map: -x,-z,-y

################################################################################################################
# Extruder
################################################################################################################

[extruder3]
step_pin: Toolhead3:gpio23
dir_pin: !Toolhead3:gpio24
enable_pin: !Toolhead3:gpio25
microsteps: 16
rotation_distance: 46.589               # measured at 1 mm/s, with gear_ratio 9:1
gear_ratio: 9:1
full_steps_per_rotation: 200
nozzle_diameter: 0.400                  # hot tighten the nozzle at 285 C, 2.5 Nm
filament_diameter: 1.750
max_extrude_only_distance: 200          # allows LOAD/UNLOAD_FILAMENT moves
pressure_advance: 0.025                 # fallback only, real value per filament profile in Orca
pressure_advance_smooth_time: 0.03
heater_pin: Toolhead3:gpio9
#max_power: 0.6                         # not limited on this tool (other hotend)
sensor_type: Generic 3950
sensor_pin: Toolhead3:gpio29
pullup_resistor: 2200
control: pid
pid_Kp: 27.704
pid_Ki: 2.252
pid_Kd: 85.190
min_extrude_temp: 170
min_temp: 0
max_temp: 290

[tmc2209 extruder3]
uart_pin: Toolhead3:gpio0
tx_pin: Toolhead3:gpio1
sense_resistor: 0.100
run_current: 0.6
interpolate: false
stealthchop_threshold: 0


################################################################################################################
# Fans
################################################################################################################

# Hotend fan - monitored by config/macros/hotend_fan_monitor.cfg
[heater_fan Toolhead3_hotend_fan]
pin: Toolhead3:gpio5
heater: extruder3
heater_temp: 50.0                       # fan runs above this hotend temperature
shutdown_speed: 1
tachometer_pin: Toolhead3:gpio16        # rpm feedback for the fan monitor
tachometer_ppr: 2

# Part cooling fan
[fan_generic Toolhead3_part_fan]
pin: Toolhead3:gpio6


################################################################################################################
# Toolchanger
# Dock position, offsets and input shaper of this tool
################################################################################################################

[tool T3]
tool_number: 3                          # tool index
extruder: extruder3                     # extruder of this tool
fan: Toolhead3_part_fan                 # part cooling fan of this tool
params_park_x: 290.5                    # absolute X of the tool in its dock
params_park_y: 3.6                      # absolute Y of the tool in its dock
params_park_z: 250                      # absolute Z where tool and shuttle mate in the dock
gcode_x_offset: 0.080                   # X offset to T0, measured with Axiscope
gcode_y_offset: -0.240                  # Y offset to T0, measured with Axiscope
gcode_z_offset: 0.147                   # Z offset to T0, measured with Axiscope

# Input shaper, measured per tool with Shake&Tune, applied on every tool change
params_input_shaper_type_x: '2hump_ei'
params_input_shaper_freq_x: 70.4
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 32.8


################################################################################################################
# Tap Probe
################################################################################################################

[tool_probe T3]
pin: Toolhead3:gpio10
tool: 3                                 # tool index
z_offset: -1.300                        # paper test value, unused as long as homing is done with T0
speed: 5.0
lift_speed: 28
samples: 3                              # probes per point
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    {% set h = printer.extruder3 %}
    {% set adjust = h.target != 150 or h.temperature > 152 %}             ; nozzle has to be heated or cooled to 150 C
    {% if adjust %}
        STATUS_LED STATE=heating                                           ; logo orange while adjusting
    {% endif %}
    _TAP_PROBE_ACTIVATE HEATER=extruder3                                      ; brings the nozzle to 150 C for Tap
    {% if adjust %}
        STATUS_LED STATE={printer['gcode_macro STATUS_LED'].state}        ; back to the previous state (homing, qgl, mesh ...)
    {% endif %}


################################################################################################################
# Lights
################################################################################################################

# LED chain: index 1 = logo, index 2-3 = nozzle light
# Colors are set by config/macros/status_leds.cfg
[neopixel T3]
pin: Toolhead3:gpio7
color_order: GRBW
chain_count: 3
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.3                      # dim white until Klipper is ready (red means error)

# Activity LED on the board
[output_pin act_led_T3]
pin: !Toolhead3:gpio8


################################################################################################################
# Additional Sensors
################################################################################################################

[temperature_sensor Toolhead3]
sensor_type: temperature_mcu
sensor_mcu: Toolhead3
min_temp: 0
max_temp: 100


################################################################################################################
# Tool Macro
# Sets the Spoolman spool of this tool (or clears it), then selects the tool
################################################################################################################

[gcode_macro T3]
variable_active: 0                      # must be 0
variable_color: ""                      # leave empty
variable_spool_id: None                 # set by the web UI, see spoolman_tracking.cfg
gcode:
    {% if printer["gcode_macro T3"].spool_id %}
        SET_ACTIVE_SPOOL ID={printer["gcode_macro T3"].spool_id}
    {% else %}
        CLEAR_ACTIVE_SPOOL
    {% endif %}
    SELECT_TOOL T=3
