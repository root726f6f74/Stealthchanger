################################################################################################################
# Tool 1 (T1)
# Toolhead board: LDO Nitehawk 36 StealthChanger Edition (USB)
# Extruder:       Orbiter 2.5
# Hotend:         Rapido 2 HF
# Use:            Standard material
################################################################################################################


################################################################################################################
# MCU
################################################################################################################

[mcu Toolhead1]
serial: /dev/serial/by-id/usb-Klipper_rp2040_303339383405A0C5-if00    # find with: ls -l /dev/serial/by-id/
restart_method: command


################################################################################################################
# Accelerometer
################################################################################################################

[adxl345 T1]
cs_pin: Toolhead1:gpio27
spi_software_sclk_pin: Toolhead1:gpio18
spi_software_mosi_pin: Toolhead1:gpio20
spi_software_miso_pin: Toolhead1:gpio19
axes_map: -x,-z,-y

################################################################################################################
# Extruder
################################################################################################################

[extruder1]
step_pin: Toolhead1:gpio23
dir_pin: !Toolhead1:gpio24
enable_pin: !Toolhead1:gpio25
microsteps: 32
rotation_distance: 4.69                 # Orbiter manufacturer value
full_steps_per_rotation: 200
nozzle_diameter: 0.400                  # hot tighten the nozzle at 285 C, 2.5 Nm
filament_diameter: 1.750
max_extrude_only_distance: 200          # allows LOAD/UNLOAD_FILAMENT moves
pressure_advance: 0.025                 # fallback only, real value per filament profile in Orca
pressure_advance_smooth_time: 0.03
heater_pin: Toolhead1:gpio9
max_power: 0.6                          # Nitehawk 36 max 120 W, Rapido heater 115 W * 0.6 = 69 W
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: Toolhead1:gpio29
pullup_resistor: 2200
control: pid
pid_Kp: 18.825
pid_Ki: 1.549
pid_Kd: 57.183
min_extrude_temp: 170
min_temp: 0
max_temp: 290

[tmc2209 extruder1]
uart_pin: Toolhead1:gpio0
tx_pin: Toolhead1:gpio1
sense_resistor: 0.100
run_current: 0.5
interpolate: false
stealthchop_threshold: 0


################################################################################################################
# Fans
################################################################################################################

# Hotend fan - monitored by config/macros/hotend_fan_monitor.cfg
[heater_fan Toolhead1_hotend_fan]
pin: Toolhead1:gpio5
heater: extruder1
heater_temp: 50.0                       # fan runs above this hotend temperature
shutdown_speed: 1
tachometer_pin: Toolhead1:gpio16        # rpm feedback for the fan monitor
tachometer_ppr: 2

# Part cooling fan
[fan_generic Toolhead1_part_fan]
pin: Toolhead1:gpio6


################################################################################################################
# Toolchanger
# Dock position, offsets and input shaper of this tool
################################################################################################################

[tool T1]
tool_number: 1                          # tool index
extruder: extruder1                     # extruder of this tool
fan: Toolhead1_part_fan                 # part cooling fan of this tool
params_park_x: 100.3                    # absolute X of the tool in its dock
params_park_y: 3.1                      # absolute Y of the tool in its dock
params_park_z: 250                      # absolute Z where tool and shuttle mate in the dock
gcode_x_offset: -0.010                  # X offset to T0, measured with Axiscope
gcode_y_offset: -0.100                  # Y offset to T0, measured with Axiscope
gcode_z_offset: 0.104                   # Z offset to T0, measured with Axiscope

# Input shaper, measured per tool with Shake&Tune, applied on every tool change
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 47.8
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 34.4


################################################################################################################
# Tap Probe
################################################################################################################

[tool_probe T1]
pin: Toolhead1:gpio10
tool: 1                                 # tool index
z_offset: -1.496                        # paper test value, unused as long as homing is done with T0
speed: 5.0
lift_speed: 28
samples: 3                              # probes per point
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder1   ; checks the nozzle is cool enough for Tap


################################################################################################################
# Lights
################################################################################################################

# Logo LEDs: index 1 red, index 2-3 white
[neopixel T1]
pin: Toolhead1:gpio7
color_order: GRBW
chain_count: 3
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[delayed_gcode set_t1_leds]
initial_duration: 1
gcode:
    SET_LED LED=T1 RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=T1 RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=2 TRANSMIT=0
    SET_LED LED=T1 RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=3

# Activity LED on the board
[output_pin act_led_T1]
pin: !Toolhead1:gpio8


################################################################################################################
# Additional Sensors
################################################################################################################

[temperature_sensor Toolhead1]
sensor_type: temperature_mcu
sensor_mcu: Toolhead1
min_temp: 0
max_temp: 100


################################################################################################################
# Tool Macro
# Sets the Spoolman spool of this tool (or clears it), then selects the tool
################################################################################################################

[gcode_macro T1]
variable_active: 0                      # must be 0
variable_color: ""                      # leave empty
variable_spool_id: None                 # set by the web UI, see spoolman_tracking.cfg
gcode:
    {% if printer["gcode_macro T1"].spool_id %}
        SET_ACTIVE_SPOOL ID={printer["gcode_macro T1"].spool_id}
    {% else %}
        CLEAR_ACTIVE_SPOOL
    {% endif %}
    SELECT_TOOL T=1
