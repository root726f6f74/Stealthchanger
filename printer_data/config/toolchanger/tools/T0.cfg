################################################################################################################
# Tool 0 (T0)
# Toolhead board: LDO Nitehawk 36 StealthChanger Edition (USB)
# Extruder:       Orbiter 2.5
# Hotend:         Rapido 2 HF
# Use:            Standard material, reference tool for all offsets
################################################################################################################


################################################################################################################
# MCU
################################################################################################################

[mcu Toolhead0]
serial: /dev/serial/by-id/usb-Klipper_rp2040_30333938340538B7-if00    # find with: ls -l /dev/serial/by-id/
restart_method: command


################################################################################################################
# Accelerometer
################################################################################################################

[adxl345 T0]
cs_pin: Toolhead0:gpio27
spi_software_sclk_pin: Toolhead0:gpio18
spi_software_mosi_pin: Toolhead0:gpio20
spi_software_miso_pin: Toolhead0:gpio19
axes_map: -x,-z,-y

################################################################################################################
# Extruder
################################################################################################################

[extruder]
step_pin: Toolhead0:gpio23
dir_pin: !Toolhead0:gpio24
enable_pin: !Toolhead0:gpio25
microsteps: 32
rotation_distance: 4.69                 # Orbiter manufacturer value
full_steps_per_rotation: 200
nozzle_diameter: 0.400                  # hot tighten the nozzle at 285 C, 2.5 Nm
filament_diameter: 1.750
max_extrude_only_distance: 200          # allows LOAD/UNLOAD_FILAMENT moves
pressure_advance: 0.025                 # fallback only, real value per filament profile in Orca
pressure_advance_smooth_time: 0.03
heater_pin: Toolhead0:gpio9
max_power: 0.6                          # Nitehawk 36 max 120 W, Rapido heater 115 W * 0.6 = 69 W
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: Toolhead0:gpio29
pullup_resistor: 2200
control: pid
pid_Kp: 12.321
pid_Ki: 0.797
pid_Kd: 47.590
min_extrude_temp: 170
min_temp: 0
max_temp: 290

[tmc2209 extruder]
uart_pin: Toolhead0:gpio0
tx_pin: Toolhead0:gpio1
sense_resistor: 0.100
run_current: 0.5
interpolate: false
stealthchop_threshold: 0


################################################################################################################
# Fans
################################################################################################################

# Hotend fan - monitored by config/macros/hotend_fan_monitor.cfg
[heater_fan Toolhead0_hotend_fan]
pin: Toolhead0:gpio5
heater: extruder
heater_temp: 50.0                       # fan runs above this hotend temperature
shutdown_speed: 1
tachometer_pin: Toolhead0:gpio16        # rpm feedback for the fan monitor
tachometer_ppr: 2

# Part cooling fan
[fan_generic Toolhead0_part_fan]
pin: Toolhead0:gpio6


################################################################################################################
# Toolchanger
# Dock position, offsets and input shaper of this tool
################################################################################################################

[tool T0]
tool_number: 0                          # tool index
extruder: extruder                      # extruder of this tool
fan: Toolhead0_part_fan                 # part cooling fan of this tool
params_park_x: 3.8                      # absolute X of the tool in its dock
params_park_y: 2.1                      # absolute Y of the tool in its dock
params_park_z: 250                      # absolute Z where tool and shuttle mate in the dock
gcode_x_offset: 0                       # always 0, T0 is the reference tool
gcode_y_offset: 0                       # always 0, T0 is the reference tool
gcode_z_offset: 0                       # always 0, T0 is the reference tool


# Input shaper, measured per tool with Shake&Tune, applied on every tool change
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 49.0
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 34.2


################################################################################################################
# Tap Probe
################################################################################################################

[tool_probe T0]
pin: Toolhead0:gpio10
tool: 0                                 # tool index
z_offset: -1.355                        # Tap trigger to nozzle, used for homing. More positive = more squish
speed: 5.0
lift_speed: 28
samples: 3                              # probes per point
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    {% set h = printer.extruder %}
    {% set adjust = h.target != 150 or h.temperature > 152 %}             ; nozzle has to be heated or cooled to 150 C
    {% if adjust %}
        STATUS_LED STATE=heating                                           ; logo orange while adjusting
    {% endif %}
    _TAP_PROBE_ACTIVATE HEATER=extruder                                      ; brings the nozzle to 150 C for Tap
    {% if adjust %}
        STATUS_LED STATE={printer['gcode_macro STATUS_LED'].state}        ; back to the previous state (homing, qgl, mesh ...)
    {% endif %}


################################################################################################################
# Lights
################################################################################################################

# LED chain: index 1 = logo, index 2-3 = nozzle light
# Colors are set by config/macros/status_leds.cfg
[neopixel T0]
pin: Toolhead0:gpio7
color_order: GRBW
chain_count: 3
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.3                      # dim white until Klipper is ready (red means error)

# Activity LED on the board
[output_pin act_led_T0]
pin: !Toolhead0:gpio8


################################################################################################################
# Additional Sensors
################################################################################################################

[temperature_sensor Toolhead0]
sensor_type: temperature_mcu
sensor_mcu: Toolhead0
min_temp: 0
max_temp: 100


################################################################################################################
# Tool Macro
# Sets the Spoolman spool of this tool (or clears it), then selects the tool
################################################################################################################

[gcode_macro T0]
variable_active: 0                      # must be 0
variable_color: ""                      # leave empty
variable_spool_id: None                 # set by the web UI, see spoolman_tracking.cfg
gcode:
    {% if printer["gcode_macro T0"].spool_id %}
        SET_ACTIVE_SPOOL ID={printer["gcode_macro T0"].spool_id}
    {% else %}
        CLEAR_ACTIVE_SPOOL
    {% endif %}
    SELECT_TOOL T=0
