################################################################################################################
# Voron 2.4 StealthChanger - Main Config
#
# 300 x 300 mm, BTT Octopus, 4 tools on LDO Nitehawk 36 boards
# This file only includes the other config files. Per-tool settings live in toolchanger/tools/Tx.cfg.
# The SAVE_CONFIG block at the bottom holds the skew profile and axis twist compensation.
################################################################################################################



################################################################################################################
# Base
################################################################################################################
[include mainsail.cfg]                                  # stock Mainsail macros (PAUSE, RESUME, CANCEL_PRINT)
[include config/machine.cfg]                            # general machine settings



################################################################################################################
# MCU
################################################################################################################
[include config/mcus/btt_octopus.cfg]                   # main board + pin aliases



################################################################################################################
# Toolchanger
# Stock klipper-toolchanger-easy files, also pulls in toolchanger-config.cfg and tools/T0-T3.cfg
################################################################################################################
[include toolchanger/readonly-configs/toolchanger-include.cfg]



################################################################################################################
# Hardware
################################################################################################################
[include config/kinematics/corexy.cfg]                  # kinematics, speed and accel limits
[include config/hardware/z.cfg]                         # 4 Z steppers
[include config/hardware/xy.cfg]                        # A/B steppers
[include config/hardware/heated_bed.cfg]                # 230 V bed
[include config/hardware/fans.cfg]                      # electronics bay fans
[include config/hardware/filter.cfg]                    # "The Filter" bed fans
[include config/hardware/chamber_temp.cfg]              # chamber thermistor
#[include config/hardware/rpi_temp.cfg]                 # planned
[include config/hardware/lights.cfg]                   # planned



################################################################################################################
# Software
################################################################################################################
[include config/software/axis_twist_compensation.cfg]
[include config/software/qgl.cfg]
[include config/software/bed_mesh.cfg]
[include config/software/resonance_tester.cfg]
[include config/software/shaketune.cfg]
[include config/software/spoolman_tracking.cfg]
[include config/software/axiscope.cfg]



################################################################################################################
# Macros
################################################################################################################
[include config/macros/print_start.cfg]
[include config/macros/print_end.cfg]
[include config/macros/cancel_print.cfg]                # Mainsail CANCEL_PRINT settings + cleanup
[include config/macros/load_filament.cfg]
[include config/macros/unload_filament.cfg]
[include config/macros/dock_tuner.cfg]                  # third party macro, unchanged
[include config/macros/filament_ooze_calibration.cfg]
[include config/macros/git_backup.cfg]
[include config/macros/hotend_fan_monitor.cfg]
[include config/macros/status_leds.cfg]



