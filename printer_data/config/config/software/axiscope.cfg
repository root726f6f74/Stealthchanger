[axiscope]
pin: ^SEXBALL             # PG13, NC gegen GND -> Pull-up, kein "!"
zswitch_x_pos: 242.6      # PFLICHT - X der Kugelmitte (mit T0 anfahren)
zswitch_y_pos: 297.2      # PFLICHT - Y der Kugelmitte
zswitch_z_pos: 6.0        # PFLICHT - Z beim Aufsetzen + 3 mm
lift_z: 1                 # optional, Standard 1
move_speed: 60            # optional, XY mm/s, Standard 60 (nur ganze Zahlen)
z_move_speed: 10          # optional, Z mm/s, Standard 10 (nur ganze Zahlen)
samples: 10               # optional, Messungen pro Tool, Standard 10

start_gcode:
  {% set tools = printer.toolchanger.tool_numbers %}
  {% for tool in tools %}
      M104 T{tool} S150
  {% endfor %}
before_pickup_gcode: M118 pickup_gcode
after_pickup_gcode: M118 after_pickup_gcode
finish_gcode: M118 Calibration complete
  {% set tools = printer.toolchanger.tool_numbers %}
  {% for tool in tools %}
      M104 T{tool} S0
  {% endfor %}
  T0