################################################################################################################
# Axiscope - Tool Offset Calibration
# XY offsets via camera, Z offsets via the Sexball probe at the rear right of the bed.
# All offsets are measured relative to T0 and entered by hand as gcode_x/y/z_offset in tools/Tx.cfg.
################################################################################################################

[axiscope]
pin: ^SEXBALL             # PG13, normally closed to GND -> pull-up, no "!"
zswitch_x_pos: 242.6      # required - X of the ball center (approach with T0)
zswitch_y_pos: 297.2      # required - Y of the ball center
zswitch_z_pos: 6.0        # required - Z at contact + 3 mm
lift_z: 1                 # optional, default 1
move_speed: 60            # optional, XY in mm/s, default 60 (integers only)
z_move_speed: 10          # optional, Z in mm/s, default 10 (integers only)
samples: 10               # optional, measurements per tool, default 10

start_gcode:
  # Preheat all tools to 150 C standby, so the nozzles are at a stable temperature
  {% set tools = printer.toolchanger.tool_numbers %}
  {% for tool in tools %}
      M104 T{tool} S150
  {% endfor %}
before_pickup_gcode: M118 pickup_gcode
after_pickup_gcode: M118 after_pickup_gcode
finish_gcode: M118 Calibration complete
  # Turn off all tools and return to T0
  {% set tools = printer.toolchanger.tool_numbers %}
  {% for tool in tools %}
      M104 T{tool} S0
  {% endfor %}
  T0
