################################################################################################################
# Spoolman - Per-Tool Spool Tracking
#
# How it works:
#   - Spools are assigned per tool in Fluidd/Mainsail (Spoolman panel -> change spool).
#     The UI stores the ID in variable_spool_id of the tool macro (T0-T3) and in saved_variables.cfg.
#   - On every tool change the tool macro calls SET_ACTIVE_SPOOL (or CLEAR_ACTIVE_SPOOL if the tool
#     has no spool), so Moonraker books the used filament on the right spool.
#   - After a restart RESTORE_SELECTED_SPOOLS reads saved_variables.cfg and restores the assignment.
#
# Requires [save_variables] (machine.cfg) and [spoolman] (moonraker.conf).
################################################################################################################


################################################################################################################
# Set the active spool, called by the tool macros
################################################################################################################

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
    {% if params.ID %}
        {% set id = params.ID|int %}
        {action_call_remote_method(
            "spoolman_set_active_spool",
            spool_id=id
        )}
    {% else %}
        {action_respond_info("Parameter 'ID' is required")}
    {% endif %}


################################################################################################################
# Clear the active spool (tool without an assigned spool)
################################################################################################################

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
    {action_call_remote_method(
        "spoolman_set_active_spool",
        spool_id=None
    )}


################################################################################################################
# Restore the spool assignment of all tools after a restart
################################################################################################################

[delayed_gcode RESTORE_SELECTED_SPOOLS]
initial_duration: 0.1
gcode:
    {% set svv = printer.save_variables.variables %}
    {% for object in printer %}
        {% if object.startswith('gcode_macro ') and printer[object].spool_id is defined %}
            {% set macro = object.replace('gcode_macro ', '') %}
            {% set var = (macro + '__SPOOL_ID')|lower %}
            {% if svv[var] is defined %}
                SET_GCODE_VARIABLE MACRO={macro} VARIABLE=spool_id VALUE={svv[var]}
            {% endif %}
        {% endif %}
    {% endfor %}
