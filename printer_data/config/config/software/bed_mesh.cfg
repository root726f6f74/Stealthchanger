################################################################################################################
# Bed Mesh
# PRINT_START runs BED_MESH_CALIBRATE ADAPTIVE=1, so only the print area is probed
################################################################################################################

[bed_mesh]
speed: 350
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 270, 270
probe_count: 5, 5           # full bed mesh, adaptive meshes scale this down to the print area
algorithm: bicubic
