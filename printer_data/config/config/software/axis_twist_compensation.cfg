################################################################################################################
# Axis Twist Compensation
# Corrects first layer differences along X and Y (front had more squish than rear, right more than left).
# Calibrate warm with AXIS_TWIST_COMPENSATION_CALIBRATE (AXIS=X / AXIS=Y), results go to the SAVE_CONFIG block.
################################################################################################################

[axis_twist_compensation]
horizontal_move_z: 5
# X calibration: points along X at Y = calibrate_y
calibrate_start_x: 30
calibrate_end_x: 270
calibrate_y: 150
# Y calibration: points along Y at X = calibrate_x
calibrate_start_y: 30
calibrate_end_y: 270
calibrate_x: 150
