################################################################################################################
# Quad Gantry Leveling
# Runs in PRINT_START with T0 after homing
################################################################################################################

[quad_gantry_level]
gantry_corners:             # outermost Z belt mounting points: min X,Y and max X,Y
   -60,-10
   360,370
points:                     # probe points: front left, rear left, rear right, front right
   50,25
   50,250
   250,250
   250,25
speed: 350
horizontal_move_z: 3
retries: 5
retry_tolerance: 0.0075
max_adjust: 10
