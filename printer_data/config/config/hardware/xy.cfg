################################################################################################################
# X Stepper (B motor) - 0.9 deg, sensorless homing
################################################################################################################

[stepper_x]
step_pin: MOTOR_X_STEP
dir_pin: MOTOR_X_DIR
enable_pin: !MOTOR_X_EN
rotation_distance: 40                   # 20T pulley, GT2 belt
microsteps: 32
full_steps_per_rotation: 400            # 0.9 deg stepper
endstop_pin: tmc2209_stepper_x:virtual_endstop      # sensorless homing via StallGuard
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 40
homing_retract_dist: 0                  # must be 0 for sensorless homing
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: MOTOR_X_UART
diag_pin: ^MOTOR_X_DIAG                 # needed for sensorless homing
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0                # always spreadCycle
driver_SGTHRS: 145                      # StallGuard threshold: 255 = most sensitive, 0 = least sensitive



################################################################################################################
# Y Stepper (A motor) - 0.9 deg, physical endstop
################################################################################################################

[stepper_y]
step_pin: MOTOR_Y_STEP
dir_pin: MOTOR_Y_DIR
enable_pin: !MOTOR_Y_EN
rotation_distance: 40                   # 20T pulley, GT2 belt
microsteps: 32
full_steps_per_rotation: 400            # 0.9 deg stepper
endstop_pin: LIMIT_Y
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 60
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: MOTOR_Y_UART
#diag_pin: MOTOR_Y_DIAG                 # only needed for sensorless homing
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0                # always spreadCycle
#driver_SGTHRS: 100                     # only needed for sensorless homing
