################################################################################################################
# X Stepper
################################################################################################################

[stepper_x]
step_pin: MOTOR_X_STEP
dir_pin: MOTOR_X_DIR
enable_pin: !MOTOR_X_EN
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: MOTOR_X_UART
diag_pin: ^MOTOR_X_DIAG
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 145                       # 255 is most sensitive value, 0 is least sensitive


################################################################################################################
# Y Stepper
################################################################################################################

[stepper_y]
step_pin: MOTOR_Y_STEP
dir_pin: MOTOR_Y_DIR
enable_pin: !MOTOR_Y_EN
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: LIMIT_Y
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 60
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: MOTOR_Y_UART
#diag_pin: MOTOR_Y_DIAG
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
#driver_SGTHRS: 100                      # 255 is most sensitive value, 0 is least sensitive