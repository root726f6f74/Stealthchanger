################################################################################################################
# "The Filter" - 4x Bed Fans
# Filters the chamber air and helps heat the chamber (approx. 60 C with ASA)
# Set to fixed speeds on purpose (100 % for heat soak), no regulation on chamber temperature
################################################################################################################

[fan_generic filter]
pin: FAN_FILTER
kick_start_time: 0.250
off_below: 0.4              # requested speeds below 40 % turn the fans off
