################################################################################################################
# Case Light - 2x Daylight on a Stick (24 V, 4000K white LEDs)
# Connected to FAN1 on the Octopus (voltage jumper on V_FUSED = 24 V)
# Dimmable via slider in Fluidd/Mainsail or SET_PIN PIN=caselight VALUE=0.0-1.0
################################################################################################################

[output_pin caselight]
pin: CASELIGHT              # alias in btt_octopus.cfg (PE5 = FAN1)
pwm: True                   # allows dimming instead of just on/off
cycle_time: 0.01            # 100 Hz PWM, as recommended in the Daylight README
value: 1                    # light on after Klipper start
shutdown_value: 1           # light on on shutdown / emergency stop