################################################################################################################
# Raspberry Pi 4 - CPU Temperature
# Display only, shown in Fluidd/Mainsail and logged in klippy.log
# Reads /sys/class/thermal/thermal_zone0/temp, no extra MCU or setup needed
################################################################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100               # Klipper shuts down above this value. The Pi 4 throttles itself from 80 C on
