################################################################################################################
# Heated Bed - 300 x 300 mm, 230 V AC
# 115 C set temperature for ASA results in approx. 101-102 C on the surface after heat soak (bed fans at 100 %)
################################################################################################################

[heater_bed]
heater_pin: HE_BED
sensor_type: Generic 3950
sensor_pin: TH_BED
max_power: 0.6              # limits heating power so the bed does not warp. Rule of thumb: 0.4 W/cm2
min_temp: 0
max_temp: 120
control: pid
pid_kp: 36.082
pid_ki: 1.572
pid_kd: 207.022
