################################################################################################################
# Heated Bed - 300x300 230VAC
################################################################################################################

[heater_bed]
heater_pin: HE_BED
sensor_type: Generic 3950 
sensor_pin: TH_BED
max_power: 0.6                               #Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2
min_temp: 0
max_temp: 120
control: pid
pid_kp: 36.082
pid_ki: 1.572
pid_kd: 207.022