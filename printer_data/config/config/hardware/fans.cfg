################################################################################################################
# Electronics Bay - 2x LDO Controller Fans
################################################################################################################

[controller_fan controller_fan]
pin: FAN_CONTROLLER
kick_start_time: 0.5
heater: heater_bed          # also runs while the bed is heating
fan_speed: 0.6              # speed while steppers or bed are active
idle_timeout: 60            # seconds to keep running after everything is off
idle_speed: 0.3             # speed during idle_timeout
