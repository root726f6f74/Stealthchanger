################################################################################################################
# Kinematics - CoreXY
# Velocity and acceleration limits. PRINT_END restores these values after a print.
################################################################################################################

[printer]
kinematics: corexy
max_velocity: 450
max_accel: 10000
max_z_velocity: 125      # tuning start value 30, Discord suggests 150-250, 100 tested on V2.4
max_z_accel: 1250        # tuning start value 500, Discord suggests 1500-2000, 1000 tested on V2.4
square_corner_velocity: 5.0
