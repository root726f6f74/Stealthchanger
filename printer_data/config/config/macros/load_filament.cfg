[gcode_macro LOAD_FILAMENT]
description: Load filament into the active tool
gcode:
  ##########################################################
  # Parameters
  # 245C works for all materials and also melts leftover
  # ASA/ABS in the nozzle when switching to PLA/PETG
  ##########################################################
  {% set TEMP = params.TEMP | default(245) | float %}           ; load temperature



  ##########################################################
  # Detect mounted tool and activate its extruder
  # Needed after a restart without homing
  ##########################################################
  INITIALIZE_TOOLCHANGER             ; detect mounted tool



  SAVE_GCODE_STATE NAME=LOAD_FILAMENT_state                     ; save current state



  ##########################################################
  # Heat hotend to load temperature
  ##########################################################
  STATUS_LED STATE=heating           ; logo orange
  M109 S{TEMP}                       ; heat and wait
  STATUS_LED                         ; back to automatic



  ##########################################################
  # Load and purge
  ##########################################################
  M83                                ; relative extrusion
  G92 E0                             ; reset extruder position
  G1 E90 F200                        ; feed filament to just above the nozzle
  G1 E50 F150                        ; push slowly through the nozzle and purge
  M400                               ; wait for all moves to finish



  ##########################################################
  # Settle and final purge
  # Pause lets trapped air escape, then extrude with the same
  # flow as OOZE_TEST (15mm3/s) so the 16mm retract matches
  # the calibrated conditions
  ##########################################################
  G4 P10000                          ; wait 10s, let trapped air escape
  G1 E40 F374                        ; extrude 40mm at 15mm3/s (15 / 2.405 * 60)
  G1 E-16 F2700                      ; retract 16mm at 45mm/s, same as tool change
  M400                               ; wait for all moves to finish
  G92 E0                             ; reset extruder position



  ##########################################################
  # Standby temperature
  # No oozing at 150C, faster heat up if a print follows
  # idle_timeout turns the heater off if nothing happens
  ##########################################################
  M104 S150                          ; drop to standby, no wait



  ##########################################################
  # Restore previous state
  ##########################################################
  RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_state