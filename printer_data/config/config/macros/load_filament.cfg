[gcode_macro LOAD_FILAMENT]
description: Filament laden in den aktiven Toolhead
gcode:
    {% set TEMP = params.TEMP | default(250) | float %}
    {% set active_extruder = printer.toolhead.extruder %}

    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_state

    ; Temperatur sicherstellen
    {% if printer[active_extruder].target != 0 %}
        {% if printer[active_extruder].temperature < printer[active_extruder].target %}
            M109 S{printer[active_extruder].target | float}
        {% endif %}
    {% else %}
        {% if printer[active_extruder].temperature < TEMP %}
            M109 S{TEMP}
        {% endif %}
    {% endif %}

    M83          ; Relative Extrusion
    G92 E0       ; Extruder Reset
    G1 E105 F200 ; Einziehen bis kurz vor die Düse
    G1 E50 F150  ; Langsam durch die Düse + Purge
    M400
    G92 E0       ; Extruder Reset

    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_state