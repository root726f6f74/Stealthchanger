[gcode_macro OOZE_TEST]
description: Mit vorgegebenem Volumenstrom extrudieren, dann zurückziehen
gcode:
  {% set retract = params.RETRACT|default(10)|float %}    # Retract-Länge in mm, Vorgabe 10
  {% set retract_speed = params.RETRACT_SPEED|default(2700)|float %}   # Retract-Geschwindigkeit in mm/min, 2700 = 45 mm/s
  {% set extrude = params.EXTRUDE|default(30)|float %}    # vorher extrudierte Filamentlänge in mm
  {% set flow = params.FLOW|default(15)|float %}          # Volumenstrom in mm3/s, wie Max volumetric speed in Orca
  {% set feed = flow / 2.405 * 60 %}                      # Umrechnung in Extruder-Vorschub mm/min (2.405 mm2 = Querschnitt 1,75-mm-Filament)
  RESPOND MSG="Durchfluss {flow} mm3/s, F{feed|round(0)|int}"   # berechnete Werte in der Konsole ausgeben
  SAVE_GCODE_STATE NAME=ooze_test                         # aktuellen G-Code-Zustand sichern (u. a. Extrudermodus)
  M83                                                     # Extruder auf relative Werte stellen
  G1 E{extrude} F{feed}                                   # mit dem gewählten Volumenstrom extrudieren
  G1 E-{retract} F{retract_speed}                         # direkt danach zurückziehen
  RESTORE_GCODE_STATE NAME=ooze_test                      # gesicherten Zustand wiederherstellen