################################################################################################################
# Ooze Test
# Extrudes at a set volumetric flow and retracts right after, then you watch whether the nozzle oozes.
# Used to find the tool change retract (16 mm). LOAD_FILAMENT uses the same flow and retract.
#
# Example: OOZE_TEST RETRACT=16 FLOW=15
################################################################################################################

[gcode_macro OOZE_TEST]
description: Extrude at a set volumetric flow, then retract
gcode:
  ##########################################################
  # Parameters
  ##########################################################
  {% set retract = params.RETRACT|default(10)|float %}                  ; retract length in mm
  {% set retract_speed = params.RETRACT_SPEED|default(2700)|float %}    ; retract speed in mm/min, 2700 = 45 mm/s
  {% set extrude = params.EXTRUDE|default(30)|float %}                  ; length to extrude before the retract in mm
  {% set flow = params.FLOW|default(15)|float %}                        ; volumetric flow in mm3/s, like "Max volumetric speed" in Orca
  {% set feed = flow / 2.405 * 60 %}                                    ; convert to feed rate in mm/min (2.405 mm2 = cross section of 1.75 mm filament)



  ##########################################################
  # Extrude and retract
  ##########################################################
  RESPOND MSG="Flow {flow} mm3/s, F{feed|round(0)|int}"                 ; show the calculated values in the console
  SAVE_GCODE_STATE NAME=ooze_test                                       ; save state (extrusion mode etc.)
  M83                                                                   ; relative extrusion
  G1 E{extrude} F{feed}                                                 ; extrude at the set flow
  G1 E-{retract} F{retract_speed}                                       ; retract right after
  RESTORE_GCODE_STATE NAME=ooze_test                                    ; restore state
