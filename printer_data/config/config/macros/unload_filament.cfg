[gcode_macro UNLOAD_FILAMENT]
description: Filament entladen aus dem aktiven Toolhead
gcode:
    {% set TEMP = params.TEMP | default(250) | float %}
    {% set DISTANCE = params.DISTANCE | default(150) | float %}
    {% set active_extruder = printer.toolhead.extruder %}

    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_state

    ; Temperatur sicherstellen
    {% if printer[active_extruder].target != 0 %}
        {% if printer[active_extruder].temperature < printer[active_extruder].target %}
            M109 S{printer[active_extruder].target | float}
        {% endif %}
    {% else %}
        {% if printer[active_extruder].temperature < TEMP %}
            M109 S{TEMP}
        {% endif %}
    {% endif %}

    ; Tip Shaping
    {% set old_pressure_advance = printer[active_extruder].pressure_advance | default(0) %}
    SET_PRESSURE_ADVANCE EXTRUDER={active_extruder} ADVANCE=0
    M82        ; Absolute Extrusion
    G92 E0
    G1 E2 F3600
    G1 E0 F3600
    G1 E3 F3600
    G1 E0 F3600
    G1 E4 F3600
    G1 E0 F3600
    SET_PRESSURE_ADVANCE EXTRUDER={active_extruder} ADVANCE={old_pressure_advance}
    M400

    ; Entladen
    M83        ; Relative Extrusion
    G1 E-20 F3600   ; Schnell zurück
    G4 P3000        ; 3 Sekunden warten
    G1 E{DISTANCE * -1} F3000  ; Restliche Distanz entladen
    M400

    G92 E0
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_state