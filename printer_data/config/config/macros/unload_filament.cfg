[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the active tool
gcode:
  ##########################################################
  # Parameters
  # 245C works for all materials
  ##########################################################
  {% set TEMP = params.TEMP | default(245) | float %}           ; unload temperature
  {% set DISTANCE = params.DISTANCE | default(150) | float %}   ; total unload distance in mm



  ##########################################################
  # Detect mounted tool and activate its extruder
  # Needed after a restart without homing
  ##########################################################
  INITIALIZE_TOOLCHANGER             ; detect mounted tool



  SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_state                   ; save current state



  ##########################################################
  # Heat hotend to unload temperature
  ##########################################################
  STATUS_LED STATE=heating           ; logo orange
  M109 S{TEMP}                       ; heat and wait
  STATUS_LED                         ; back to automatic



  ##########################################################
  # Deretract
  # Tools rest 16mm retracted (tool change, PRINT_END, LOAD_FILAMENT)
  # Push filament back into the melt zone before tip shaping
  ##########################################################
  M83                                ; relative extrusion
  G1 E16 F1800                       ; deretract 16mm



  ##########################################################
  # Tip shaping
  # Short back and forth moves form a clean filament tip
  # (pressure advance does not affect extrude only moves)
  ##########################################################
  M82                                ; absolute extrusion
  G92 E0                             ; reset extruder position
  G1 E2 F3600                        ; push 2mm
  G1 E0 F3600                        ; pull back
  G1 E3 F3600                        ; push 3mm
  G1 E0 F3600                        ; pull back
  G1 E4 F3600                        ; push 4mm
  G1 E0 F3600                        ; pull back
  M400                               ; wait for all moves to finish



  ##########################################################
  # Unload
  ##########################################################
  M83                                ; relative extrusion
  G1 E-20 F3600                      ; fast retract out of the melt zone
  G4 P3000                           ; wait 3s to let the tip cool
  G1 E{DISTANCE * -1} F3000          ; unload remaining distance
  M400                               ; wait for all moves to finish



  ##########################################################
  # Standby temperature
  # idle_timeout turns the heater off if nothing happens
  ##########################################################
  M104 S150                          ; drop to standby, no wait



  ##########################################################
  # Restore previous state
  ##########################################################
  G92 E0                             ; reset extruder position
  RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_state