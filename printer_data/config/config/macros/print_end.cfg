[gcode_macro PRINT_END]
gcode:
  ##########################################################
  # Calculate safe move away from the print
  # Moves 20mm in X/Y (towards the side with more room)
  # and lifts Z by 2mm (capped at max Z)
  ##########################################################
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}



  ##########################################################
  # Reset print overrides
  ##########################################################
  M220 S100                          ; reset feed rate to 100%
  M221 S100                          ; reset flow rate to 100%

  SET_PRESSURE_ADVANCE ADVANCE=0.025 ; reset pressure advance of active tool to default



  ##########################################################
  # Retract filament
  ##########################################################
  G92 E0                             ; reset extruder position
  G1 E-16.0 F3600                    ; retract to reduce oozing
  M400                               ; wait for all moves to finish



  ##########################################################
  # Return to T0 so the next print starts with T0 mounted
  ##########################################################
  T0                                 ; switch to tool 0



  ##########################################################
  # Move away from the print and park
  ##########################################################
  G90                                                           ; absolute positioning
  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000                       ; move away to break strings
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600     ; park at rear center



  ##########################################################
  # Reset gcode offset (incl. material based Z offset)
  ##########################################################
  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0



  ##########################################################
  # Shut down all tools
  ##########################################################
  {% for tn in printer.toolchanger.tool_numbers %}
      M104 S0 T{tn}                                                          ; turn off tool heater
      M107 T{tn}                                                             ; turn off tool part cooling fan
      SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0     ; disable extruder motor
  {% endfor %}



  ##########################################################
  # Shut down bed
  ##########################################################
  M140 S0                            ; turn off bed heater



  ##########################################################
  # Reset motion settings
  ##########################################################
  SET_SKEW CLEAR=1                   ; clear skew profile
  SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}        ; restore limits from printer.cfg