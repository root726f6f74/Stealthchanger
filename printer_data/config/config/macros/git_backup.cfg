################################################################################################################
# Git Backup
# Pushes the config to GitHub with Klipper-Backup (https://github.com/Staubgeborener/klipper-backup)
# Only run manually at known-good states, no automatic backups.
# Requires the gcode_shell_command extension (installed via KIAUH).
#
# Usage: UPDATE_GIT
#        UPDATE_GIT MESSAGE="Short description"
################################################################################################################

[gcode_shell_command update_git_script]                     # backup with the default commit message
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]             # backup with a custom commit message
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}
