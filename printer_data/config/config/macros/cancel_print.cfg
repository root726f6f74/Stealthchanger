################################################################################################################
# Cancel Print
# CANCEL_PRINT itself comes from Mainsail (mainsail.cfg) and is not changed.
# Mainsail reads its settings from _CLIENT_VARIABLE, so the cancel behavior is adjusted here:
#   - retract 16 mm instead of 5 mm, same as tool change and PRINT_END (16 mm concept, see README)
#   - _CANCEL_CLEANUP resets the printer like PRINT_END does
#
# Order inside Mainsail's CANCEL_PRINT:
#   retract (cancel_retract) -> TURN_OFF_HEATERS -> part fan off -> user_cancel_macro -> CANCEL_PRINT_BASE
################################################################################################################


################################################################################################################
# Mainsail client settings
# Only the values set here are changed, everything else keeps the Mainsail default
################################################################################################################

[gcode_macro _CLIENT_VARIABLE]
variable_cancel_retract: 16.0               # same retract as tool change and PRINT_END (Mainsail default 5.0)
variable_user_cancel_macro: "_CANCEL_CLEANUP"   # runs before CANCEL_PRINT_BASE
gcode:


################################################################################################################
# Cleanup after a cancelled print
# Same resets as PRINT_END, but no retract (already done by Mainsail) and no heater commands
# (TURN_OFF_HEATERS already ran, so the tool change to T0 does not wait for any temperature)
################################################################################################################

[gcode_macro _CANCEL_CLEANUP]
gcode:
  ##########################################################
  # Reset print overrides
  ##########################################################
  M220 S100                          ; reset feed rate to 100%
  M221 S100                          ; reset flow rate to 100%
  SET_PRESSURE_ADVANCE ADVANCE=0.025 ; reset pressure advance of active tool to default



  ##########################################################
  # Return to T0 so the next print starts with T0 mounted
  # Only if another tool is mounted and the printer is homed
  ##########################################################
  {% if printer.toolchanger.tool_number not in [-1, 0] and printer.toolhead.homed_axes == 'xyz' %}
    T0                               ; switch to tool 0
  {% endif %}



  ##########################################################
  # Reset gcode offset (incl. material based Z offset)
  ##########################################################
  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0



  ##########################################################
  # Part fans and extruder motors of all tools off
  ##########################################################
  {% for tn in printer.toolchanger.tool_numbers %}
      M107 T{tn}                                                             ; turn off tool part cooling fan
      SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0     ; disable extruder motor
  {% endfor %}



  ##########################################################
  # Reset motion settings
  ##########################################################
  SET_SKEW CLEAR=1                   ; clear skew profile
  SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}        ; restore limits from printer.cfg
