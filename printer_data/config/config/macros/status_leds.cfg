################################################################################################################
# Status LEDs - All Tools
#
# LED chain per tool (neopixel Tx, 3 LEDs):
#   index 1    = logo, shows the status
#   index 2-3  = nozzle light, always full white
#
# Logo of the mounted tool:
#   event state (wrappers, PRINT_START, LOAD/UNLOAD)  homing, qgl, mesh, heating
#   otherwise from print_stats              paused, printing, error, done (last print finished)
#   otherwise from the heaters              heating (bed or tool still below target)
#   otherwise                               hot (nozzle above hot_temp or heater on), done, ready
#
# Logo of the docked tools:
#   nozzle above hot_temp or heater on -> hot (dim orange)
#   otherwise                          -> off
#
# The Tap probe (activate_gcode in tools/Tx.cfg) shows "heating" while it brings the nozzle to 150 C.
#
# A hotend fan fault (hotend_fan_monitor.cfg) turns the logo of that tool red, docked or mounted.
# Faults stay until the next PRINT_START or STATUS_LED_RESET.
#
# How the event states are cleared:
#   The loop can only run while no other command is running (Klipper G-code mutex).
#   So whenever the loop runs, any event (homing, QGL ...) is over, and it clears the event state.
#   This also cleans up after an aborted command (e.g. failed QGL).
################################################################################################################


################################################################################################################
# Settings and colors
# Colors are [red, green, blue, white], 0.0 - 1.0
################################################################################################################

[gcode_macro STATUS_LED]
description: Set an event status for the logo LED (STATE=homing|qgl|mesh|heating), no STATE = automatic
variable_interval: 3                # seconds between loop updates
variable_hot_temp: 50               # nozzle counts as hot above this temperature
variable_colors: {
    'ready':      [0.0, 0.0,  0.0, 0.3],
    'homing':     [0.0, 0.0,  1.0, 0.0],
    'qgl':        [0.6, 0.0,  1.0, 0.0],
    'mesh':       [0.0, 1.0,  1.0, 0.0],
    'heating':    [1.0, 0.35, 0.0, 0.0],
    'printing':   [0.0, 1.0,  0.0, 0.0],
    'paused':     [1.0, 0.8,  0.0, 0.0],
    'error':      [1.0, 0.0,  0.0, 0.0],
    'done':       [0.0, 0.25, 0.0, 0.0],
    'hot':        [0.3, 0.08, 0.0, 0.0],
    'off':        [0.0, 0.0,  0.0, 0.0]
  }
variable_state: ''                  # current event state, managed by the macros
variable_faults: []                 # heaters with a fan fault, managed by the macros
variable_last: {}                   # last color per tool, avoids sending unchanged values
gcode:
    SET_GCODE_VARIABLE MACRO=STATUS_LED VARIABLE=state VALUE="'{params.STATE|default('')|lower}'"
    _STATUS_LED_UPDATE


################################################################################################################
# Update - sets the logo color of every tool
################################################################################################################

[gcode_macro _STATUS_LED_UPDATE]
gcode:
    {% set cfg = printer['gcode_macro STATUS_LED'] %}
    {% set ps = printer.print_stats.state %}
    {% set tc = printer.toolchanger %}
    {% set bed = printer.heater_bed %}
    {% set new = {} %}
    {% for n in tc.tool_numbers %}
        {% set ext = printer.configfile.settings['tool t' ~ n].extruder %}         ; extruder of this tool
        {% set heater = printer[ext] %}

        {% if ext in cfg.faults %}
            {% set key = 'error' %}                                              ; fan fault on this tool
        {% elif n == tc.tool_number %}                                           ; mounted tool
            {% if cfg.state %}
                {% set key = cfg.state %}
            {% elif ps == 'paused' %}
                {% set key = 'paused' %}
            {% elif ps == 'printing' %}
                {% set key = 'printing' %}
            {% elif ps == 'error' %}
                {% set key = 'error' %}
            {% elif (heater.target > 0 and heater.temperature < heater.target - 5)
                 or (bed.target > 0 and bed.temperature < bed.target - 3) %}
                {% set key = 'heating' %}
            {% elif heater.temperature > cfg.hot_temp or heater.target > 0 %}
                {% set key = 'hot' %}                                            ; idle, but nozzle hot
            {% elif ps == 'complete' %}
                {% set key = 'done' %}
            {% else %}
                {% set key = 'ready' %}
            {% endif %}
        {% elif heater.temperature > cfg.hot_temp or heater.target > 0 %}
            {% set key = 'hot' %}                                                ; docked and hot
        {% else %}
            {% set key = 'off' %}                                                ; docked and cold
        {% endif %}

        {% set c = cfg.colors[key] if key in cfg.colors else cfg.colors['ready'] %}
        {% if cfg.last.get(n|string) != key %}                                   ; only send changes
            SET_LED LED=T{n} RED={c[0]} GREEN={c[1]} BLUE={c[2]} WHITE={c[3]} INDEX=1
        {% endif %}
        {% set _ = new.update({n|string: key}) %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=STATUS_LED VARIABLE=last VALUE="{new}"


################################################################################################################
# Faults - called by _HOTEND_FAN_FAULT, cleared by PRINT_START or STATUS_LED_RESET
################################################################################################################

[gcode_macro STATUS_LED_FAULT]
description: Mark the tool of HEATER=<extruder> as faulty (red logo)
gcode:
    {% set faults = printer['gcode_macro STATUS_LED'].faults %}
    {% if params.HEATER not in faults %}
        SET_GCODE_VARIABLE MACRO=STATUS_LED VARIABLE=faults VALUE="{faults + [params.HEATER]}"
    {% endif %}
    _STATUS_LED_UPDATE

[gcode_macro STATUS_LED_RESET]
description: Clear fault colors and event state
gcode:
    SET_GCODE_VARIABLE MACRO=STATUS_LED VARIABLE=faults VALUE="[]"
    SET_GCODE_VARIABLE MACRO=STATUS_LED VARIABLE=state VALUE="''"
    _STATUS_LED_UPDATE


################################################################################################################
# Startup and loop
# The loop reschedules itself first, so an error in the update can not stop it
################################################################################################################

[delayed_gcode STATUS_LED_INIT]
initial_duration: 1
gcode:
    {% for n in printer.toolchanger.tool_numbers %}
        SET_LED LED=T{n} RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=2 TRANSMIT=0  ; nozzle light
        SET_LED LED=T{n} RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=3              ; nozzle light
    {% endfor %}
    UPDATE_DELAYED_GCODE ID=STATUS_LED_LOOP DURATION=1

[delayed_gcode STATUS_LED_LOOP]
gcode:
    UPDATE_DELAYED_GCODE ID=STATUS_LED_LOOP DURATION={printer["gcode_macro STATUS_LED"].interval}
    SET_GCODE_VARIABLE MACRO=STATUS_LED VARIABLE=state VALUE="''"           ; no command running -> event over
    _STATUS_LED_UPDATE


################################################################################################################
# Wrappers - show QGL and bed mesh, also when started from the web UI
#
# G28 can NOT be wrapped: the toolchanger homing_override calls G28 internally again,
# and Klipper does not allow a macro to call itself ("Macro G28 called recursively").
# Homing is therefore only shown when PRINT_START sets it.
################################################################################################################

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL_BASE
description: Quad gantry level (status LED wrapper)
gcode:
    STATUS_LED STATE=qgl
    _QUAD_GANTRY_LEVEL_BASE {rawparams}
    STATUS_LED

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Bed mesh calibrate (status LED wrapper)
gcode:
    STATUS_LED STATE=mesh
    _BED_MESH_CALIBRATE_BASE {rawparams}
    STATUS_LED
