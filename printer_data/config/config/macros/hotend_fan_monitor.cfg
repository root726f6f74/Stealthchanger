################################################################################################################
# Hotend Fan Monitor - alle Tools
# Basiert auf dem Prinzip von Ellis' fan_tach_monitor, erweitert auf mehrere heater_fan
#
# Logik pro Tool (unabhängig davon, ob aktiv, im Dock oder ungenutzt):
#   Lüfter soll laufen (speed > 0) UND Hotend > heater_temp + Marge UND rpm < MIN_RPM
#   -> Zähler +1, sonst Zähler = 0
#   Zähler erreicht LIMIT -> Heizung dieses Tools aus, bei laufendem Druck PAUSE
#
# Kalte, ungenutzte Tools: Lüfter aus -> werden nicht geprüft
# Tools im Dock auf Standby-Temperatur: Lüfter an -> werden geprüft
################################################################################################################

[delayed_gcode HOTEND_FAN_MONITOR_LOOP]
initial_duration: 10
gcode:
    _HOTEND_FAN_CHECK
    UPDATE_DELAYED_GCODE ID=HOTEND_FAN_MONITOR_LOOP DURATION={printer["gcode_macro _HOTEND_FAN_CHECK"].interval}

[gcode_macro _HOTEND_FAN_CHECK]
variable_min_rpm: 1500        # ANPASSEN: ca. 50 % der normalen Drehzahl (in Fluidd ablesen)
variable_limit: 3             # so viele Prüfungen in Folge zu langsam -> Fehler
variable_interval: 3          # Sekunden zwischen den Prüfungen
variable_temp_margin: 10      # erst ab heater_temp + Marge prüfen (Anlaufen/Abschalten ignorieren)
variable_counts: {}
gcode:
    {% set new_counts = {} %}
    {% for obj in printer %}
        {% if obj.startswith('heater_fan ') %}
            {% set fan = printer[obj] %}
            {% set cfg = printer.configfile.settings[obj|lower] %}
            {% set heater = cfg.heater[0] if cfg.heater is not string else cfg.heater %}
            {% set temp = printer[heater].temperature %}
            {% set n = counts.get(obj, 0) %}

            {% if fan.rpm is not none and fan.speed > 0
                  and temp > cfg.heater_temp + temp_margin
                  and fan.rpm < min_rpm %}
                {% set n = n + 1 %}
                RESPOND TYPE=error MSG="{obj}: {fan.rpm|int} U/min bei {temp|round(1)} °C ({n}/{limit})"
                {% if n >= limit %}
                    _HOTEND_FAN_FAULT FAN="{obj}" HEATER={heater}
                    {% set n = 0 %}
                {% endif %}
            {% else %}
                {% set n = 0 %}
            {% endif %}
            {% set _ = new_counts.update({obj: n}) %}
        {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_CHECK VARIABLE=counts VALUE="{new_counts}"

[gcode_macro _HOTEND_FAN_FAULT]
gcode:
    SET_HEATER_TEMPERATURE HEATER={params.HEATER} TARGET=0
    RESPOND TYPE=error MSG="HOTEND-LÜFTER AUSGEFALLEN: {params.FAN} - Heizung {params.HEATER} abgeschaltet"
    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% endif %}