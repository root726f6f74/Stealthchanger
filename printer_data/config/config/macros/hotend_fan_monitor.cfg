################################################################################################################
# Hotend Fan Monitor - All Tools
# Based on the fan_tach_monitor from Ellis' Print Tuning Guide, extended to every heater_fan
#
# Logic per tool (no matter if active, docked or unused):
#   fan should run (speed > 0) AND hotend > heater_temp + margin AND rpm < min_rpm
#   -> counter +1, otherwise counter = 0
#   counter reaches limit -> heater of this tool off, PAUSE if a print is running
#
# Cold, unused tools: fan off -> not checked
# Docked tools at standby temperature: fan on -> checked
################################################################################################################


################################################################################################################
# Loop - runs _HOTEND_FAN_CHECK every "interval" seconds, starts 10 s after Klipper is ready
# The next run is scheduled first, so an error in the check can never stop the monitor
################################################################################################################

[delayed_gcode HOTEND_FAN_MONITOR_LOOP]
initial_duration: 10
gcode:
    UPDATE_DELAYED_GCODE ID=HOTEND_FAN_MONITOR_LOOP DURATION={printer["gcode_macro _HOTEND_FAN_CHECK"].interval}
    _HOTEND_FAN_CHECK


################################################################################################################
# Check - one pass over all hotend fans
################################################################################################################

[gcode_macro _HOTEND_FAN_CHECK]
variable_min_rpm: 1500        # fault threshold, approx. 50 % of the normal fan speed
variable_limit: 3             # this many slow checks in a row -> fault
variable_interval: 3          # seconds between checks
variable_temp_margin: 10      # only check above heater_temp + margin (ignores spin up and shut down)
variable_counts: {}           # slow check counter per fan, managed by the macro
gcode:
    {% set new_counts = {} %}                                                    ; counters for this pass
    {% for obj in printer %}
        {% if obj.startswith('heater_fan ') %}                                   ; hotend fans only
            {% set fan = printer[obj] %}
            {% set cfg = printer.configfile.settings[obj|lower] %}
            {% set heater = cfg.heater[0] if cfg.heater is not string else cfg.heater %}     ; heater of this fan
            {% set temp = printer[heater].temperature %}
            {% set n = counts.get(obj, 0) %}                                     ; counter from the last pass

            {% if fan.rpm is not none and fan.speed > 0
                  and temp > cfg.heater_temp + temp_margin
                  and fan.rpm < min_rpm %}
                {% set n = n + 1 %}                                              ; fan too slow
                RESPOND TYPE=error MSG="{obj}: {fan.rpm|int} rpm at {temp|round(1)} °C ({n}/{limit})"
                {% if n >= limit %}
                    _HOTEND_FAN_FAULT FAN="{obj}" HEATER={heater}
                    {% set n = 0 %}                                              ; reset after the fault was handled
                {% endif %}
            {% else %}
                {% set n = 0 %}                                                  ; fan ok or not checked -> reset
            {% endif %}
            {% set _ = new_counts.update({obj: n}) %}
        {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_CHECK VARIABLE=counts VALUE="{new_counts}"      ; keep counters for the next pass


################################################################################################################
# Fault - turn off the heater of the affected tool, pause a running print
# Safety first: heater off and PAUSE come before the LED, so a LED problem can not block them
################################################################################################################

[gcode_macro _HOTEND_FAN_FAULT]
gcode:
    SET_HEATER_TEMPERATURE HEATER={params.HEATER} TARGET=0                      ; heater off
    RESPOND TYPE=error MSG="HOTEND FAN FAILURE: {params.FAN} - heater {params.HEATER} turned off"
    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% endif %}
    STATUS_LED_FAULT HEATER={params.HEATER}                                     ; logo of this tool red (last)
