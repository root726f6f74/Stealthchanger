[gcode_macro PRINT_START]
gcode:
  ##########################################################
  # Parameters passed from the slicer
  ##########################################################
  {% set TOOL = params.TOOL | default(0)| int %}               ; initial tool number
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}    ; first layer temp of initial tool
  {% set BED_TEMP = params.BED_TEMP | default(0) | int %}      ; first layer bed temp
  {% set material = params.MATERIAL|default("ASA")|upper %}    ; filament type of initial tool



  ##########################################################
  # Reset first use tracking for _TOOL_FIRST_USE
  # Initial tool counts as used, its deretract is in the prime line
  ##########################################################
  SET_GCODE_VARIABLE MACRO=_TOOL_FIRST_USE VARIABLE=used VALUE="[{TOOL}]"



  ##########################################################
  # Material based Z offset (reference = ASA = 0.0)
  # Positive value = nozzle higher = less squish
  # More specific names must be checked first (substring match)
  ##########################################################
  {% if "PETG" in material %}
    {% set z_mat = 0.03 %}
  {% elif "TPU" in material %}
    {% set z_mat = 0.0 %}
  {% elif "PLA" in material %}
    {% set z_mat = 0.0 %}
  {% else %}
    {% set z_mat = 0.0 %}
  {% endif %}



  ##########################################################
  # Disable crash detection during homing and calibration
  ##########################################################
  {% if printer.tool_probe_endstop is defined %}
    M117 Disabling crash detection
    STOP_CRASH_DETECTION
  {% endif %}



  ##########################################################
  # Heat bed
  ##########################################################
  M117 Heating Bed
  M190 S{BED_TEMP}                   ; wait for bed temperature



  ##########################################################
  # Homing and calibration
  ##########################################################
  BED_MESH_CLEAR                     ; clear any loaded mesh

  M117 Homing
  G28                                ; home all axes

  T0                                 ; Ensure we have T0 active for pre print calibrations.

  M117 Quad Gantry Level
  QUAD_GANTRY_LEVEL                  ; level the gantry

  G28 Z                              ; home Z again after QGL

  BED_MESH_CALIBRATE ADAPTIVE=1      ; adaptive mesh of the print area only

  SKEW_PROFILE LOAD=Califlower       ; load skew correction profile



  ##########################################################
  # Switch to initial tool and heat it
  ##########################################################
  {% if TOOL > 0 %}
    M104 T0 S0                       ; turn off T0 heater
    T{params.TOOL}                   ; pick up the initial printing tool
  {% endif %}



  ##########################################################
  # Preheat all other tools used in this print to standby
  # 150C = no ooze in the dock, shorter wait on first change
  ##########################################################
  {% for t in printer.toolchanger.tool_numbers %}
    {% set key = "T" ~ t ~ "_TEMP" %}
    {% if key in params and t != TOOL %}
      SET_TOOL_TEMPERATURE T={t} TARGET=150   ; standby preheat, no wait
    {% endif %}
  {% endfor %}

  M117 Waiting on T{params.TOOL} S{TOOL_TEMP}C
  M109 S{TOOL_TEMP}                  ; wait for tool temperature



  ##########################################################
  # Re-enable crash detection
  ##########################################################
  {% if printer.tool_probe_endstop is defined %}
    M117 Re-enabling crash detection
    START_CRASH_DETECTION
  {% endif %}



  ##########################################################
  # Apply material based Z offset
  # Absolute value, persists across tool changes
  # Reset with SET_GCODE_OFFSET Z=0 in PRINT_END
  ##########################################################
  SET_GCODE_OFFSET Z={z_mat} MOVE=1
  RESPOND MSG="Material {material}: Z-Offset {z_mat}"



  ##########################################################
  # Prime line with safe approach
  ##########################################################
  G90                            ; absolute positioning
  G0 Z10 F3000                   ; move to safe Z height first
  G0 X100 F10000                 ; move to start X, Y unchanged
  G0 Y5 F10000                   ; move straight to the front
  G0 Z0.4 F3000                  ; lower to prime height
  G92 E0                         ; reset extruder position
  G1 E16 F1800                   ; deretract the 16mm from the last tool change / print end
  G91                            ; relative positioning
  G1 X100 E20 F1000              ; prime line from X100 to X200
  G90                            ; back to absolute positioning
  G92 E0                         ; reset extruder position again



[gcode_macro _TOOL_FIRST_USE]
description: Deretract 16mm on the first use of a tool in a print
variable_used: []
gcode:
  ##########################################################
  # Tools rest 16mm retracted (tool change, PRINT_END, LOAD_FILAMENT)
  # The slicer only deretracts what it retracted in this print,
  # so the first use of each tool needs a manual deretract
  ##########################################################
  {% set tn = printer.toolchanger.tool_number %}
  {% set ext = printer.toolhead.extruder %}
  {% if tn not in used %}
    SET_GCODE_VARIABLE MACRO=_TOOL_FIRST_USE VARIABLE=used VALUE="{used + [tn]}"
    M109 S{printer[ext].target}      ; make sure the tool is hot before extruding
    M83                              ; relative extrusion
    G1 E16 F1800                     ; deretract 16mm
  {% endif %}