################################################################################################################
# Main MCU - BTT Octopus (STM32F446)
################################################################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_3E0035001350324E31333220-if00    # find with: ls -l /dev/serial/by-id/
restart_method: command


################################################################################################################
# Pin Aliases
# All other config files use these names instead of raw pins, so a board swap only needs changes here
################################################################################################################

[board_pins mcu_octopus]
aliases:
# Steppers: X = driver 0, Y = driver 1, Z0-Z3 = drivers 2-5
    MOTOR_X_EN=PF14, MOTOR_X_STEP=PF13,  MOTOR_X_DIR=PF12,  MOTOR_X_UART=PC4,  MOTOR_X_DIAG=PG6,
    MOTOR_Y_EN=PF15, MOTOR_Y_STEP=PG0,   MOTOR_Y_DIR=PG1,   MOTOR_Y_UART=PD11, MOTOR_Y_DIAG=PG9,
    MOTOR_Z_EN=PG5,  MOTOR_Z_STEP=PF11,  MOTOR_Z_DIR=PG3,   MOTOR_Z_UART=PC6,
    MOTOR_Z1_EN=PA0, MOTOR_Z1_STEP=PG4,  MOTOR_Z1_DIR=PC1,  MOTOR_Z1_UART=PC7,
    MOTOR_Z2_EN=PG2, MOTOR_Z2_STEP=PF9,  MOTOR_Z2_DIR=PF10, MOTOR_Z2_UART=PF2,
    MOTOR_Z3_EN=PF1, MOTOR_Z3_STEP=PC13, MOTOR_Z3_DIR=PF0,  MOTOR_Z3_UART=PE4,
# Endstops: Y endstop, Sexball probe for Axiscope
    LIMIT_Y=PG12, SEXBALL=PG13,
# Fans
    FAN_FILTER=PB11, FAN_CONTROLLER=PA8,
# Heater
    HE_BED=PA1,
# Thermistors
    TH_BED=PF3, TH_CHAMBER=PF4,
# Lights
    CASELIGHT=PE5
