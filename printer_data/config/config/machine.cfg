################################################################################################################
# Machine
# General settings that do not belong to a specific piece of hardware
################################################################################################################

[idle_timeout]
timeout: 1800                       # 30 min without activity -> heaters and motors off

[respond]                           # enables RESPOND / M118, used by the macros

[exclude_object]                    # cancel single objects during a print

[gcode_arcs]
resolution: 0.1                     # segment length for G2/G3 arcs in mm

[skew_correction]                   # profile "Califlower" is stored in the SAVE_CONFIG block

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg     # stores the Spoolman spool per tool
